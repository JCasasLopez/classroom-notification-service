# General 
spring.application.name=classroom-notification-service
spring.main.web-application-type=none
spring.profiles.active=dev

# Database-ralated
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.datasource.url=jdbc:mysql://localhost:3306/failed_notifications
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_ROOT_USERNAME}
spring.datasource.password=${DB_ROOT_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Kafka 
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=dev.jcasaslopez.classroom.shared.event.NotificationEvent
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.group-id=classroom-notification-service
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=RECORD

kafka.topic.name.notifications=${KAFKA_TOPIC_NOTIFICATIONS:notifications}

# Mail 
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

# Email retry system
notification.retry.max-attempts=5
notification.retry.initial-delay-ms=1000
notification.retry.backoff-multiplier=2
notification.retry.scheduler-fixed-delay-ms=60000