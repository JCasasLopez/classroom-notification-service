# General 
spring.application.name=classroom-notification-service
spring.main.web-application-type=none
spring.profiles.active=dev

# Kafka 
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.dev.jcasaslopez.model.Email
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.group-id=classroom-notification-service
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=RECORD

kafka.topic.name.notifications=${KAFKA_TOPIC_NOTIFICATIONS:notifications}

# Mail 
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}